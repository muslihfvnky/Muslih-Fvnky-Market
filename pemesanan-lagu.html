  <script>
    function kirimWA() {
      const Judul = document.getElementById('Judul').value.trim();
      const Style = document.getElementById('Style').value.trim();
      const LinkYT = document.getElementById('LinkYT').value.trim();

      if (!Judul || !Style || !LinkYT) {
        alert('Mohon isi semua data');
        return;
      }

      const transaksiID = `RMX-${Math.floor(100000 + Math.random() * 900000)}`;
      const now = new Date();
      const jam = now.toTimeString().split(' ')[0];
      const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
      const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      const tanggal = `${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()}`;

      const pesan = `*Website Pemesanan Remix - Muslih Fvnky*\n\n*📌 ID Transaksi : ${transaksiID}*\n*🎵 Judul        : ${Judul}*\n*🎧 Style        : ${Style}*\n*🔗 Link YT Style : ${LinkYT}*\n*🕒 Jam          : ${jam} WIB*\n*📅 Tanggal      : ${tanggal}*\n\n> *Harga tergantung kesulitan style & lagu*\n> *Terima kasih, tunggu balasan admin 🙏🏻*`;

      const url = `https://wa.me/6283821665970?text=${encodeURIComponent(pesan)}`;
      window.open(url, '_blank');
    }
