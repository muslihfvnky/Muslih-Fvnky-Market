<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komentar & Rating - Muslih Fvnky Shop</title>

  <link rel="icon" type="image/png" href="logowebbundar.webp" sizes="512x512">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root{
      --mint:#0FFCBE;
      --blue:#106EBE;
      --panel:rgba(4,18,26,.82);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      min-height:100vh;
      color:#fff;
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      background:
        linear-gradient(rgba(0,0,0,.68),rgba(0,0,0,.78)),
        url('backgroundweb.webp') center/cover fixed no-repeat;
    }

    .glass{
      background:var(--panel);
      border:1px solid rgba(15,252,190,.18);
      box-shadow:0 15px 45px rgba(0,0,0,.35);
      backdrop-filter:blur(12px);
    }

    .btn{
      border:1px solid rgba(15,252,190,.55);
      background:rgba(16,110,190,.5);
      transition:.2s;
    }

    .btn:hover{
      background:rgba(15,252,190,.16);
      transform:translateY(-1px);
    }

    input,
    textarea,
    select{
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.14);
      color:#fff;
    }

    input:focus,
    textarea:focus,
    select:focus{
      outline:none;
      border-color:rgba(15,252,190,.7);
      box-shadow:0 0 0 2px rgba(15,252,190,.08);
    }

    /* =========================
       RATING
    ========================= */

    .rating-btn input{
      display:none;
    }

    .rating-btn span{
      font-size:1.8rem;
      color:#64717a;
      opacity:1;
      cursor:pointer;
      transition:.15s;
      line-height:1;
    }

    .rating-btn.active span{
      color:#facc15;
      opacity:1;
    }

    .rating-btn:hover span{
      color:#facc15;
      opacity:1;
    }

    /* =========================
       COMMENT CARD
    ========================= */

    .comment-card{
      background:rgba(0,0,0,.28);
      border:1px solid rgba(255,255,255,.08);
      overflow:hidden;
    }

    /* Avatar hanya inisial */
    .avatar{
      width:46px;
      height:46px;
      min-width:46px;
      border-radius:999px;
      background:
        linear-gradient(
          135deg,
          rgba(15,252,190,.35),
          rgba(16,110,190,.45)
        );
      border:1px solid rgba(15,252,190,.25);
      display:grid;
      place-items:center;
      font-weight:900;
      font-size:1rem;
      color:#fff;
      text-transform:uppercase;
    }

    /* Foto ulasan */
    .review-photo{
      display:block;
      width:100%;
      max-width:520px;
      max-height:420px;
      object-fit:cover;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      margin-top:16px;
      cursor:pointer;
      transition:.2s;
    }

    .review-photo:hover{
      transform:scale(1.01);
      border-color:rgba(15,252,190,.4);
    }

    /* Kotak balasan admin */
    .admin-reply{
      margin-top:18px;
      margin-left:0;
      padding:14px 16px;
      border-radius:14px;
      background:rgba(16,110,190,.12);
      border:1px solid rgba(15,252,190,.18);
    }

    .admin-reply-header{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:6px;
      font-weight:800;
      color:var(--mint);
    }

    .admin-reply-icon{
      width:28px;
      height:28px;
      border-radius:999px;
      background:rgba(15,252,190,.12);
      border:1px solid rgba(15,252,190,.2);
      display:grid;
      place-items:center;
      font-size:.85rem;
    }

    .admin-reply-text{
      color:rgba(255,255,255,.78);
      line-height:1.6;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .comment-text{
      color:rgba(255,255,255,.82);
      line-height:1.7;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
    }

    .rating-stars{
      color:#facc15;
      letter-spacing:1px;
    }

    @media(max-width:640px){

      .review-photo{
        max-height:320px;
      }

      .admin-reply{
        padding:12px;
      }

      .comment-card{
        padding:16px !important;
      }
    }
  </style>
</head>

<body>

<header class="glass border-x-0 border-t-0">

  <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between gap-3">

    <div class="flex items-center gap-3">

      <img
        src="logowebbundar.webp"
        class="w-11 h-11 rounded-full object-cover"
        alt="Muslih Fvnky Shop"
      >

      <div>
        <h1 class="font-black">
          Muslih Fvnky Shop
        </h1>

        <p class="text-xs text-white/50">
          Komentar & Rating
        </p>
      </div>

    </div>

    <a
      href="index.html"
      class="btn rounded-lg px-3 py-2 text-sm font-bold"
    >
      ← Kembali
    </a>

  </div>

</header>


<main class="max-w-4xl mx-auto px-4 py-8">

  <!-- =========================
       HEADER
  ========================== -->

  <section class="text-center mb-7">

    <h2 class="text-3xl font-black">
      💬 Komentar & Rating
    </h2>

    <p class="text-white/60 mt-2">
      Bagikan pengalaman kamu di Muslih Fvnky Shop.
    </p>

    <div class="glass rounded-2xl p-5 mt-5 inline-flex items-center gap-4">

      <div>

        <div
          id="avgRating"
          class="text-3xl font-black"
        >
          —
        </div>

        <div
          id="avgStars"
          class="text-lg rating-stars"
        >
          ☆☆☆☆☆
        </div>

      </div>

      <div class="text-left">

        <div
          id="commentCount"
          class="font-bold"
        >
          0 komentar
        </div>

        <div class="text-xs text-white/45">
          Komentar yang sudah disetujui admin
        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       FORM KOMENTAR
  ========================== -->

  <section class="glass rounded-2xl p-5 sm:p-6 mb-7">

    <h3 class="text-xl font-black">
      Tulis Komentar
    </h3>

    <p class="text-sm text-white/45 mt-1">
      Komentar akan muncul setelah disetujui admin.
    </p>


    <form
      id="commentForm"
      class="grid gap-4 mt-5"
    >

      <!-- Nama -->

      <label class="text-sm text-white/70">

        Nama

        <input
          id="name"
          maxlength="60"
          required
          class="w-full rounded-xl px-3 py-3 mt-1"
          placeholder="Nama kamu"
        >

      </label>


      <!-- Rating -->

      <div>

        <p class="text-sm text-white/70 mb-2">
          Rating
        </p>

        <div
          class="flex items-center gap-2"
          id="ratingGroup"
        >

          <label class="rating-btn">
            <input
              type="radio"
              name="rating"
              value="1"
            >
            <span>★</span>
          </label>

          <label class="rating-btn">
            <input
              type="radio"
              name="rating"
              value="2"
            >
            <span>★</span>
          </label>

          <label class="rating-btn">
            <input
              type="radio"
              name="rating"
              value="3"
            >
            <span>★</span>
          </label>

          <label class="rating-btn">
            <input
              type="radio"
              name="rating"
              value="4"
            >
            <span>★</span>
          </label>

          <label class="rating-btn">
            <input
              type="radio"
              name="rating"
              value="5"
              checked
            >
            <span>★</span>
          </label>

        </div>

      </div>


      <!-- Komentar -->

      <label class="text-sm text-white/70">

        Komentar

        <textarea
          id="comment"
          maxlength="500"
          required
          rows="5"
          class="w-full rounded-xl px-3 py-3 mt-1 resize-y"
          placeholder="Tulis pengalaman kamu..."
        ></textarea>

      </label>


      <!-- Foto -->

      <label class="text-sm text-white/70">

        Upload Foto

        <span class="text-white/35">
          (opsional, maks. 5 MB)
        </span>

        <input
          id="photo"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          class="w-full rounded-xl px-3 py-2.5 mt-1 file:mr-3 file:rounded-lg file:border-0 file:bg-[#0FFCBE] file:px-3 file:py-2 file:font-bold file:text-black"
        >

      </label>


      <!-- Submit -->

      <button
        id="submitBtn"
        class="btn rounded-xl px-5 py-3 font-black"
        type="submit"
      >
        Kirim Komentar
      </button>


      <p
        id="formStatus"
        class="text-sm text-white/50"
      ></p>

    </form>

  </section>


  <!-- =========================
       KOMENTAR TERBARU
  ========================== -->

  <section>

    <div class="flex items-center justify-between gap-3 mb-4">

      <h3 class="text-xl font-black">
        Komentar Terbaru
      </h3>

      <button
        id="refreshBtn"
        class="btn rounded-lg px-3 py-2 text-sm"
      >
        ↻ Refresh
      </button>

    </div>


    <div
      id="commentsList"
      class="grid gap-4"
    >

      <div class="glass rounded-2xl p-6 text-white/45">
        Memuat komentar...
      </div>

    </div>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://zmccxgydzmfdldobqaav.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_vqU2LP9ax5DLqfJY8y5h2A_j8mWbtdG";

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const $ = id =>
  document.getElementById(id);


function esc(v){

  return String(v ?? "")
    .replace(
      /[&<>"']/g,
      m =>
        ({
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          "\"":"&quot;",
          "'":"&#039;"
        }[m])
    );

}


function stars(n){

  n = Math.max(
    0,
    Math.min(
      5,
      Number(n) || 0
    )
  );

  return (
    "★".repeat(n) +
    "☆".repeat(5 - n)
  );

}


function dateText(v){

  try{

    return new Intl.DateTimeFormat(
      "id-ID",
      {
        dateStyle:"medium",
        timeStyle:"short"
      }
    ).format(new Date(v));

  }catch{

    return "-";

  }

}


function safeName(v){

  return String(v || "foto")
    .replace(
      /[^a-zA-Z0-9._-]+/g,
      "-"
    )
    .slice(0,80);

}


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

  const box =
    $("commentsList");


  const {
    data,
    error
  } = await sb
    .from("comments")
    .select(
      "id,created_at,name,rating,comment,image_url,admin_reply"
    )
    .eq(
      "approved",
      true
    )
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    box.innerHTML = `
      <div class="glass rounded-2xl p-6 text-red-300">
        Gagal memuat komentar:
        ${esc(error.message)}
      </div>
    `;

    return;

  }


  const rows =
    data || [];


  /* RATING RATA-RATA */

  const avg =
    rows.length
      ? rows.reduce(
          (a,x) =>
            a + Number(x.rating || 0),
          0
        ) / rows.length
      : 0;


  $("avgRating").textContent =
    rows.length
      ? avg.toFixed(1)
      : "—";


  $("avgStars").textContent =
    rows.length
      ? stars(Math.round(avg))
      : "☆☆☆☆☆";


  $("commentCount").textContent =
    `${rows.length} komentar`;


  /* BELUM ADA KOMENTAR */

  if(!rows.length){

    box.innerHTML = `
      <div class="glass rounded-2xl p-6 text-center text-white/45">
        Belum ada komentar.
        Jadilah yang pertama! 😊
      </div>
    `;

    return;

  }


  /* RENDER KOMENTAR */

  box.innerHTML =
    rows.map(x => {

      /*
        AVATAR SELALU INISIAL
        Tidak menggunakan image_url
      */

      const initial =
        (x.name || "?")
          .trim()
          .charAt(0)
          .toUpperCase() || "?";


      /*
        FOTO ULASAN
        Hanya muncul jika user upload foto
      */

      const reviewPhoto =
        x.image_url
          ? `
            <a
              href="${esc(x.image_url)}"
              target="_blank"
              rel="noopener"
              title="Lihat foto ulasan"
            >
              <img
                src="${esc(x.image_url)}"
                class="review-photo"
                alt="Foto ulasan dari ${esc(x.name)}"
                loading="lazy"
              >
            </a>
          `
          : "";


      /*
        BALASAN ADMIN
      */

      const adminReply =
        x.admin_reply
          ? `
            <div class="admin-reply">

              <div class="admin-reply-header">

                <div class="admin-reply-icon">
                  ↩
                </div>

                <span>
                  Balasan Muslih Fvnky
                </span>

              </div>

              <div class="admin-reply-text">
                ${esc(x.admin_reply)}
              </div>

            </div>
          `
          : "";


      return `
        <article class="comment-card rounded-2xl p-5">

          <!-- HEADER KOMENTAR -->

          <div class="flex gap-3">

            <!-- AVATAR INISIAL -->

            <div class="avatar">
              ${esc(initial)}
            </div>


            <!-- IDENTITAS -->

            <div class="min-w-0 flex-1">

              <div class="flex flex-wrap items-center gap-2">

                <strong class="font-black">
                  ${esc(x.name)}
                </strong>

                <span class="rating-stars text-sm">
                  ${stars(x.rating)}
                </span>

              </div>


              <div class="text-xs text-white/35 mt-1">
                ${esc(dateText(x.created_at))}
              </div>

            </div>

          </div>


          <!-- ISI KOMENTAR -->

          <div class="mt-4">

            <p class="comment-text">
              ${esc(x.comment)}
            </p>

          </div>


          <!-- FOTO ULASAN -->

          ${reviewPhoto}


          <!-- BALASAN ADMIN -->

          ${adminReply}

        </article>
      `;

    }).join("");

}


/* =========================
   RATING BINTANG
========================= */

const ratingButtons =
  document.querySelectorAll(".rating-btn");

function updateRatingStars(value){

  ratingButtons.forEach(btn => {

    const rating =
      Number(btn.dataset.rating);

    btn.classList.toggle(
      "active",
      rating <= value
    );

  });
}

ratingButtons.forEach((btn, index) => {

  const input =
    btn.querySelector("input");

  const value = index + 1;

  btn.dataset.rating = value;

  input.addEventListener("change", () => {
    updateRatingStars(value);
  });

  btn.addEventListener("click", () => {
    input.checked = true;
    updateRatingStars(value);
  });

});

updateRatingStars(5);


/* =========================
   SUBMIT KOMENTAR
========================= */

$("commentForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      const btn =
        $("submitBtn");

      const status =
        $("formStatus");

      const file =
        $("photo").files[0] || null;


      const name =
        $("name")
          .value
          .trim();


      const comment =
        $("comment")
          .value
          .trim();


      const rating =
        Number(
          document
            .querySelector(
              'input[name="rating"]:checked'
            )
            ?.value || 5
        );


      if(!name || !comment){

        status.textContent =
          "Nama dan komentar wajib diisi.";

        return;

      }


      /* VALIDASI FOTO */

      if(file){

        if(
          file.size >
          5 * 1024 * 1024
        ){

          status.textContent =
            "❌ Foto maksimal 5 MB.";

          return;

        }


        if(
          ![
            "image/jpeg",
            "image/png",
            "image/webp"
          ].includes(file.type)
        ){

          status.textContent =
            "❌ Format foto harus JPG, PNG, atau WEBP.";

          return;

        }

      }


      btn.disabled = true;

      status.className =
        "text-sm text-white/50";

      status.textContent =
        "⏳ Mengirim...";


      try{

        let imageUrl = null;


        /* UPLOAD FOTO ULASAN */

        if(file){

          const ext =
            (
              file.name
                .split(".")
                .pop() ||
              "webp"
            )
            .toLowerCase()
            .replace(
              /[^a-z0-9]/g,
              ""
            ) || "webp";


          const path =
            `comments/${Date.now()}-${crypto.randomUUID()}-${safeName(file.name)}.${ext}`;


          const up =
            await sb
              .storage
              .from("images")
              .upload(
                path,
                file,
                {
                  cacheControl:"3600",
                  upsert:false
                }
              );


          if(up.error){

            throw new Error(
              "Upload foto gagal: " +
              up.error.message
            );

          }


          imageUrl =
            sb
              .storage
              .from("images")
              .getPublicUrl(path)
              .data
              .publicUrl;

        }


        /* INSERT KOMENTAR */

        const {
          error
        } =
          await sb
            .from("comments")
            .insert({

              name,

              rating,

              comment,

              image_url:imageUrl,

              approved:false

            });


        if(error){

          throw new Error(
            error.message
          );

        }


        /* RESET */

        $("commentForm").reset();


        document
          .querySelector(
            'input[name="rating"][value="5"]'
          )
          .checked = true;

        updateRatingStars(5);


        status.className =
          "text-sm text-emerald-300";


        status.textContent =
          "✅ Komentar terkirim. Tunggu persetujuan admin ya!";


      }catch(err){

        status.className =
          "text-sm text-red-300";


        status.textContent =
          "❌ " + err.message;

      }finally{

        btn.disabled = false;

      }

    }
  );


/* =========================
   REFRESH
========================= */

$("refreshBtn")
  .onclick =
    loadComments;


/* =========================
   LOAD AWAL
========================= */

loadComments();

</script>

</body>
</html>
